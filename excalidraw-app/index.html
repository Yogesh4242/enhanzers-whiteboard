<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <title>Enhanzers Whiteboard</title>

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover, shrink-to-fit=no"
    />

    <meta name="referrer" content="origin" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#121212" />

    <!-- Primary Meta Tags -->
    <meta
      name="title"
      content="Enhanzers Whiteboard — Free Collaborative Online Whiteboard"
    />

    <meta
      name="description"
      content="Enhanzers Whiteboard is a free collaborative online whiteboard for sketching diagrams, wireframes, ideas, and visual concepts with a hand-drawn feel."
    />

    <meta
      name="keywords"
      content="Enhanzers Whiteboard, online whiteboard, collaborative whiteboard, drawing tool, diagram tool, virtual whiteboard, wireframe tool"
    />

    <meta name="author" content="Enhanzers" />

    <!-- Open Graph / Facebook -->
    <meta property="og:site_name" content="Enhanzers Whiteboard" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://enhanzers.com/" />

    <meta
      property="og:title"
      content="Enhanzers Whiteboard — Free Collaborative Online Whiteboard"
    />

    <meta
      property="og:description"
      content="Sketch diagrams, wireframes, ideas, and visual concepts together with Enhanzers Whiteboard."
    />

    <meta
      property="og:image"
      content="https://enhanzers.com/new-logo-enhanzers.png"
    />

    <meta
      property="og:image:alt"
      content="Enhanzers Whiteboard logo"
    />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@enhanzers" />

    <meta name="twitter:url" content="https://enhanzers.com/" />

    <meta
      name="twitter:title"
      content="Enhanzers Whiteboard — Free Collaborative Online Whiteboard"
    />

    <meta
      name="twitter:description"
      content="A free collaborative online whiteboard for diagrams, wireframes, ideas, and visual concepts."
    />

    <meta
      name="twitter:image"
      content="https://enhanzers.com/new-logo-enhanzers.png"
    />

    <meta
      name="twitter:image:alt"
      content="Enhanzers Whiteboard logo"
    />

    <!-- Canonical URL -->
    <link rel="canonical" href="https://enhanzers.com/" />

    <!-- Minimize white flash on load when dark mode is enabled -->
    <script>
      try {
        function setTheme(theme) {
          if (theme === "dark") {
            document.documentElement.classList.add("dark");
          } else {
            document.documentElement.classList.remove("dark");
          }
        }

        function getTheme() {
          const theme = window.localStorage.getItem("excalidraw-theme");

          if (theme && theme === "system") {
            return window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          }

          return theme || "light";
        }

        setTheme(getTheme());
      } catch (e) {
        console.error("Error setting dark mode", e);
      }
    </script>

    <style>
      html.dark {
        background-color: #121212;
        color: #fff;
      }
    </style>

    <!-- Warm up the connection for Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="preconnect"
      href="https://fonts.gstatic.com"
      crossorigin
    />

    <% if (typeof PROD != "undefined" && PROD == true) { %>
    <script>
      // Redirect users with auto-redirect enabled.
      //
      // This is kept from the original Excalidraw behavior.
      // Remove this block if Enhanzers should never redirect users.

      if (
        window.location.pathname === "/" &&
        !window.location.hash &&
        !window.location.search &&
        document.cookie.includes("excplus-autoredirect=true")
      ) {
        window.location.href = "https://app.excalidraw.com";
      }
    </script>

    <!-- Following placeholder is replaced during the build step -->
    <!-- PLACEHOLDER:EXCALIDRAW_APP_FONTS -->

    <!-- Register Assistant as the UI font, before the scene initializes -->
    <link
      rel="stylesheet"
      href="../packages/excalidraw/fonts/fonts.css"
      type="text/css"
    />
    <% } else { %>
    <script>
      window.EXCALIDRAW_ASSET_PATH = window.origin;
    </script>
    <% } %>

    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/apple-touch-icon.png"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon-32x32.png"
    />

    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/favicon-16x16.png"
    />

    <!-- Enhanzers version -->
    <meta name="version" content="{version}" />

    <% if (
      typeof VITE_APP_DEV_DISABLE_LIVE_RELOAD != "undefined" &&
      VITE_APP_DEV_DISABLE_LIVE_RELOAD == true
    ) { %>
    <script>
      {
        const _WebSocket = window.WebSocket;

        window.WebSocket = function (url) {
          if (/ws:\/\/localhost:.+?\/sockjs-node/.test(url)) {
            console.info(
              "[!!!] Live reload is disabled via VITE_APP_DEV_DISABLE_LIVE_RELOAD [!!!]",
            );
          } else {
            return new _WebSocket(url);
          }
        };
      }
    </script>
    <% } %>

    <script>
      // Setting this so libraries installation reuses this window tab.
      window.name = "_excalidraw";
    </script>

    <style>
      body,
      html {
        margin: 0;
        -webkit-text-size-adjust: 100%;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }

      .visually-hidden {
        position: absolute !important;
        height: 1px;
        width: 1px;
        overflow: hidden;
        clip: rect(1px, 1px, 1px, 1px);
        white-space: nowrap;
        user-select: none;
      }

      #root {
        height: 100%;
        -webkit-touch-callout: none;
        -webkit-user-select: none;
        -khtml-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
      }

      @media screen and (min-width: 1200px) {
        #root {
          -webkit-touch-callout: default;
          -webkit-user-select: auto;
          -khtml-user-select: auto;
          -moz-user-select: auto;
          -ms-user-select: auto;
          user-select: auto;
        }
      }
    </style>
  </head>

  <body>
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>

    <header>
      <h1 class="visually-hidden">Enhanzers Whiteboard</h1>
    </header>

    <div id="root"></div>

    <script type="module" src="index.tsx"></script>

    <% if (typeof PROD != "undefined" && PROD == true) { %>
    <!-- 100% privacy-friendly analytics -->
    <script>
      // Load analytics dynamically because of iframe embed tracking.
      const scriptEle = document.createElement("script");

      scriptEle.setAttribute(
        "src",
        "https://scripts.simpleanalyticscdn.com/latest.js",
      );

      scriptEle.setAttribute("type", "text/javascript");
      scriptEle.setAttribute("defer", true);
      scriptEle.setAttribute("async", true);

      if (window.self !== window.top) {
        scriptEle.setAttribute("data-auto-collect", true);
      }

      document.body.appendChild(scriptEle);
    </script>
    <!-- End analytics -->
    <% } %>
  </body>
</html>
